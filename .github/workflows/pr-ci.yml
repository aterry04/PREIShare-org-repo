# Install, lint, typecheck, test, then build.
# Node 22 and npm ci come from docs/ci/pipeline-design.md.
# Lint and test use the Node scripts in package.json. No browser suite.
# The build env values are the public placeholders from .env.example.
# Do not add deploy steps or server-only secrets.

name: PR CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://your-project-ref.supabase.co
          VITE_SUPABASE_ANON_KEY: your-anon-or-publishable-key
